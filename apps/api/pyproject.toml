[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trustfit_api"
version = "0.1.0"
description = "TrustFit REST API (FastAPI). Every score is computed by trustfit_engine."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "trustfit_engine",
]

[project.optional-dependencies]
# PDF reports: Playwright prints the same report pages the SME sees (then `playwright install chromium`)
pdf = ["playwright==1.64.1"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
