name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} (reference, engine, API)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustfit
          POSTGRES_PASSWORD: trustfit
          POSTGRES_DB: trustfit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trustfit" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://trustfit:trustfit@localhost:5432/trustfit
      TEST_DATABASE_URL: postgresql+psycopg://trustfit:trustfit@localhost:5432/trustfit_test
      REQUIRE_DB: "1"  # API tests fail instead of skipping when Postgres is missing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "packages/trustfit_engine[dev]" -e "apps/api[dev]"
      - name: Lint
        run: .venv/bin/python -m ruff check packages apps/api db
      - name: Test
        run: make test

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
