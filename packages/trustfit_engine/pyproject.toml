[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trustfit_engine"
version = "0.1.0"
description = "Pure, deterministic TrustFit scoring engine (Trust, Fit, Gap Bridge)."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["trustfit_engine*"]

[tool.setuptools.package-data]
trustfit_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
