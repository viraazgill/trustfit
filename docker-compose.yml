# `docker compose up` starts Postgres only.
# `docker compose --profile full up` also runs the API and the web app in containers.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustfit}
      POSTGRES_DB: ${POSTGRES_DB:-trustfit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trustfit}:${POSTGRES_PASSWORD:-trustfit}@db:5432/${POSTGRES_DB:-trustfit}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SCORING_AS_OF: ${SCORING_AS_OF:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [full]
    image: node:24-alpine
    working_dir: /srv/apps/web
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/srv/apps/web
      - /srv/apps/web/node_modules
    depends_on:
      - api

volumes:
  pgdata:
